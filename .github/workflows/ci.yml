name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core + dev only; MHCflurry extra intentionally omitted)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/pmhc_triage

      - name: Test (hermetic — APIs are mocked; the live MHCflurry test self-skips)
        # network is not required; --disable-socket would enforce that if pytest-socket
        # is added later. The one live MHCflurry test skips when the extra is absent.
        run: pytest -q
