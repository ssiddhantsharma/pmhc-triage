[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmhc-triage"
version = "0.0.1"
description = "HLA-coverage-adjusted effective addressable-population estimates for pMHC / T-cell immunotherapy targets"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Siddhant Sharma" }]
keywords = [
  "pmhc",
  "immunotherapy",
  "hla",
  "population-coverage",
  "target-prioritization",
  "bioinformatics",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "httpx>=0.24",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
# Optional automated presentation prediction. MHCflurry 2.2+ uses a torch backend
# (not TensorFlow). After install run: `mhcflurry-downloads fetch models_class1_presentation`.
presentation = ["mhcflurry>=2.2"]
dev = ["pytest>=7", "ruff"]

[project.scripts]
pmhc-triage = "pmhc_triage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pmhc_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live validation tests hit external APIs (cBioPortal/UniProt/MHCflurry); excluded
# from the default + CI run so the suite stays hermetic. Run them with: pytest -m live
addopts = "-m 'not live'"
markers = [
  "live: validation checks that hit external services; run explicitly with -m live",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pin an explicit, stable ruleset for CI: real-error rules (pyflakes/pycodestyle
# logic) + import hygiene. Deliberately not enabling opinionated style/preview rules
# (UP/B/FURB/PLR) — the codebase uses consistent typing imports and intentional
# graceful `except Exception` blocks; those are choices, not defects.
select = ["E4", "E7", "E9", "F", "I"]
